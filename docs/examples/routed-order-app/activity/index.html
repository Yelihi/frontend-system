<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity · Northstar</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/app.js"></script>
</head>
<body data-page="activity">
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="/"><span class="brand-mark">N</span> northstar <small>OPERATIONS</small></a>
      <p class="nav-label">WORKSPACE</p>
      <nav aria-label="Main navigation">
        <a class="nav-link" href="/">New order</a>
        <a class="nav-link active" aria-current="page" href="/activity/">Activity</a>
      </nav>
      <div class="sidebar-foot"><span class="status-dot"></span> Local workspace</div>
    </aside>
    <main>
      <header class="topbar"><span>Workspace / Activity</span><span>Operations console</span></header>
      <div class="content">
        <p class="eyebrow">ORDERS / ACTIVITY</p>
        <div class="title-row"><div><h1>Recent activity</h1><p class="lead">Orders saved in this browser.</p></div><a class="quiet-link" href="/">Create another →</a></div>
        <section class="panel" aria-labelledby="activity-heading">
          <div class="panel-head"><div><p class="eyebrow">ORDER LOG</p><h2 id="activity-heading">Saved orders</h2></div><span class="pill" id="order-count">0 entries</span></div>
          <div id="activity-list" class="activity-list" aria-live="polite"></div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
