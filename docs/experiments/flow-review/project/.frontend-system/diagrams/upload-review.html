<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FS · 흐름 검토</title><style>
:root{color-scheme:light dark}html,body{margin:0}body{padding:16px;background:light-dark(#f8f9fb,#181d23)}button,input,textarea,select{font:inherit}code,pre{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}

#fs-review{color-scheme:light dark;--surface:light-dark(#fff,#222830);--base:light-dark(#f5f6f8,#181d23);--text:light-dark(#26313d,#edf1f5);--dim:light-dark(#556473,#b7c4d0);--line:light-dark(#d8dfe7,#46515e);--accent:light-dark(#286453,#a4dbc9);--soft:light-dark(#edf5f1,#283e35);--amber:light-dark(#805414,#f4cc8a);--amberbg:light-dark(#fff4df,#3c3020);--codebg:light-dark(#f0f2f5,#151a20);font:14px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);}
#fs-review *{box-sizing:border-box;min-width:0;}
#fs-review button,#fs-review input,#fs-review textarea{font:inherit;color:inherit;}
#fs-review button,#fs-review summary{cursor:pointer;}
#fs-review button:disabled{opacity:.5;cursor:not-allowed;}
#fs-review button:focus-visible,#fs-review input:focus-visible,#fs-review textarea:focus-visible,#fs-review summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
#fs-review h2,#fs-review h3,#fs-review h4,#fs-review p{margin:0;}
#fs-review h2{font-size:22px;font-weight:600;letter-spacing:-.5px;}
#fs-review h3{font-size:17px;font-weight:600;}
#fs-review h4{font-size:14px;font-weight:600;}
#fs-review .review-app{background:var(--base);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
#fs-review .header{background:var(--surface);padding:17px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);}
#fs-review .brand{font-weight:600;display:flex;gap:10px;align-items:center;}
#fs-review .brand b{background:var(--text);color:var(--surface);padding:2px 7px;border-radius:6px;}
#fs-review .dim{color:var(--dim);}
#fs-review .small{font-size:12px;}
#fs-review .heading{padding:22px 24px 15px;}
#fs-review .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
#fs-review .spread{justify-content:space-between;}
#fs-review .badge{display:inline-block;font-size:12px;background:var(--soft);color:var(--accent);padding:3px 8px;border-radius:5px;}
#fs-review .badge.warn{background:var(--amberbg);color:var(--amber);}
#fs-review .navigation{display:flex;gap:25px;flex-wrap:wrap;padding:0 24px;border-bottom:1px solid var(--line);}
#fs-review .navigation button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 0;color:var(--dim);}
#fs-review .navigation button[aria-pressed=true]{color:var(--accent);border-color:var(--accent);font-weight:600;}
#fs-review .content{padding:22px 24px;}
#fs-review .button{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;}
#fs-review .button.primary{background:var(--text);color:var(--surface);border-color:var(--text);}
#fs-review .button[aria-pressed=true]{border-color:var(--accent);background:var(--soft);color:var(--accent);}
#fs-review .scenes{margin-bottom:20px;gap:8px;}
#fs-review .scenes button{font-size:13px;}
#fs-review .compare{display:grid;grid-template-columns:1fr 30px 1fr;gap:12px;align-items:start;}
#fs-review .compare-arrow{align-self:center;text-align:center;color:var(--dim);font-size:24px;}
#fs-review .compare-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
#fs-review .echo-screen{--ec-bg:#14212c;--ec-line:#4b5a66;--ec-text:#f0f4f7;--ec-dim:#c1ccd5;background:var(--ec-bg);color:var(--ec-text);border-radius:10px;border:1px solid var(--ec-line);overflow:hidden;}
#fs-review .echo-top{display:flex;align-items:center;gap:12px;padding:18px;}
#fs-review .echo-top .exit{border:1px solid var(--ec-line);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;}
#fs-review .progress{height:4px;background:#465762;flex:1;border-radius:3px;}
#fs-review .progress span{display:block;background:#c0d9d3;height:100%;border-radius:3px;}
#fs-review .echo-inner{padding:18px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:18px;}
#fs-review .partner{border:1px solid var(--ec-line);border-radius:12px;padding:19px 15px;text-align:center;width:100%;background:#23333e;}
#fs-review .partner small{display:block;color:#b8d9d0;font-size:12px;margin-bottom:7px;}
#fs-review .partner p{font-size:19px;font-weight:500;}
#fs-review .orb{width:120px;height:120px;border:1px solid #94b9ac;border-radius:50%;display:grid;place-items:center;margin:1px 0;}
#fs-review .orb span{width:88px;height:88px;border-radius:50%;background:#ccd2d8;color:#1d2731;display:grid;place-items:center;font-size:13px;font-weight:600;}
#fs-review .timer{border:1px solid var(--ec-line);border-radius:20px;padding:4px 13px;font-size:13px;font-variant-numeric:tabular-nums;}
#fs-review .hotspot{position:relative;width:100%;border:1px solid transparent;border-radius:8px;background:transparent;padding:10px;color:var(--ec-text);text-align:center;}
#fs-review .hotspot[aria-pressed=true]{border-color:#c2dbd5;background:#233c3a;}
#fs-review .hotspot.changed{border:1px dashed #e4b97d;background:#302c25;}
#fs-review .hotspot.changed[aria-pressed=true]{border:2px solid #e4b97d;padding:9px;}
#fs-review .change-tag{display:block;color:#efc98d;font-size:11px;text-align:left;margin-bottom:5px;}
#fs-review .audio-player{display:flex;align-items:center;gap:10px;border:1px solid var(--ec-line);padding:9px 12px;border-radius:8px;width:100%;color:var(--ec-dim);font-size:12px;}
#fs-review .audio-track{height:3px;background:#93aaa9;flex:1;}
#fs-review .echo-actions{display:flex;gap:8px;justify-content:center;align-items:center;}
#fs-review .echo-actions span{display:block;border:1px solid var(--ec-line);border-radius:24px;padding:9px 13px;font-size:13px;}
#fs-review .echo-actions .save{background:#d5d9de;color:#1d2731;border-color:#d5d9de;font-weight:600;}
#fs-review .screen-note{margin-top:8px;font-size:12px;color:var(--dim);}
#fs-review .selection{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:20px;}
#fs-review .selection-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:13px;}
#fs-review .selection p{margin:7px 0;}
#fs-review .rule-links{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
#fs-review .rule-links button{font-size:12px;background:var(--soft);color:var(--accent);border:0;border-radius:5px;padding:5px 8px;}
#fs-review pre,#fs-review code{color:var(--text)!important;background:transparent!important;opacity:1!important;text-shadow:none!important;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.7;}
#fs-review pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--codebg)!important;padding:15px;border:1px solid var(--line);border-radius:7px;margin:12px 0;}
#fs-review code{overflow-wrap:anywhere;}
#fs-review .section-gap{margin-top:24px;}
#fs-review .source{font-size:12px;margin-top:13px;color:var(--dim);}
#fs-review a{color:var(--accent);overflow-wrap:anywhere;}
#fs-review .rule-card{padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:13px;}
#fs-review .rule-card p{margin-top:9px;}
#fs-review .rule-card.selected{border-color:var(--accent);}
#fs-review .term-list{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px;}
#fs-review .term{padding:16px;background:var(--surface);border-left:2px solid var(--line);}
#fs-review .term p{margin-top:6px;}
#fs-review .interface-list{margin-top:22px;}
#fs-review .interface-item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:17px;margin-top:12px;}
#fs-review .interface-item summary{font-weight:500;}
#fs-review .test-workspace{display:grid;grid-template-columns:215px minmax(0,1fr);gap:22px;}
#fs-review .test-nav h4{margin:17px 0 8px;color:var(--dim);}
#fs-review .test-nav h4:first-child{margin-top:0;}
#fs-review .test-nav button{display:block;width:100%;text-align:left;padding:11px 12px;margin-bottom:6px;border:1px solid transparent;border-radius:7px;background:transparent;}
#fs-review .test-nav button[aria-pressed=true]{background:var(--surface);border-color:var(--accent);}
#fs-review .test-nav button small{display:block;font-size:11px;color:var(--dim);margin-bottom:3px;}
#fs-review .test-detail{padding:23px;background:var(--surface);border:1px solid var(--line);border-radius:9px;}
#fs-review .test-detail h3{font-size:19px;}
#fs-review .test-detail h4{margin-bottom:8px;}
#fs-review .test-detail section{margin-top:23px;}
#fs-review ul,#fs-review ol{padding-left:21px;margin:7px 0;}
#fs-review li{margin:6px 0;}
#fs-review .test-detail .checks{list-style:none;padding-left:0;}
#fs-review .test-detail .checks li{padding-left:21px;position:relative;}
#fs-review .test-detail .checks li:before{content:'□';position:absolute;left:0;color:var(--accent);}
#fs-review .test-confirm{border-top:1px solid var(--line);margin-top:24px;padding-top:18px;display:flex;gap:10px;align-items:flex-start;font-weight:500;}
#fs-review input[type=checkbox]{width:18px;height:18px;margin-top:4px;accent-color:var(--accent);}
#fs-review .notice{padding:12px 15px;background:var(--amberbg);color:var(--amber);border-radius:7px;margin-bottom:18px;}
#fs-review .graph{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:25px 20px;}
#fs-review .graph-grid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,95px);gap:62px 76px;}
#fs-review .graph-node{z-index:2;position:relative;background:var(--base);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;}
#fs-review .graph-node[data-group=server]{border-style:dashed;}
#fs-review .graph-node[aria-pressed=true]{border:2px solid var(--accent);padding:9px;background:var(--soft);}
#fs-review .graph-node code{display:block;font-size:12px;}
#fs-review .graph-node small{display:block;color:var(--dim);font-size:11px;}
#fs-review .graph-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1;}
#fs-review .graph-lines path{fill:none;stroke:var(--dim);stroke-width:1.5;}
#fs-review .graph-lines path.focus-edge{stroke:var(--accent);stroke-width:2;}
#fs-review .graph-lines text{fill:var(--text);stroke:var(--surface);stroke-width:5;paint-order:stroke;stroke-linejoin:round;font:11px -apple-system,BlinkMacSystemFont,sans-serif;}
#fs-review .graph-legend{margin:11px 0 17px;display:flex;gap:16px;flex-wrap:wrap;color:var(--dim);font-size:12px;}
#fs-review .editor{padding:19px;background:var(--surface);border:1px solid var(--accent);border-radius:8px;margin-top:20px;}
#fs-review .editor label{display:block;font-weight:500;margin-top:12px;}
#fs-review textarea,#fs-review input[type=text]{display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:5px;margin-top:7px;background:var(--base);}
#fs-review textarea{resize:vertical;min-height:75px;}
#fs-review .footer{padding:15px 24px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
#fs-review .json-data{margin-top:20px;}
@media(max-width:700px){#fs-review .compare{grid-template-columns:1fr;}#fs-review .compare-arrow{transform:rotate(90deg);padding:0;}#fs-review .selection-grid,#fs-review .term-list{grid-template-columns:1fr;}#fs-review .test-workspace{grid-template-columns:1fr;}#fs-review .test-nav{display:flex;flex-wrap:wrap;gap:6px;}#fs-review .test-nav h4{flex-basis:100%;margin:10px 0 0;}#fs-review .test-nav button{flex:1 1 44%;margin:0;font-size:13px;}#fs-review .graph-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:60px 58px;}#fs-review .graph-node code{font-size:11px;}#fs-review .graph-node small{font-size:11px;}}
@media(max-width:480px){#fs-review .content,#fs-review .heading,#fs-review .header{padding:16px;}#fs-review .navigation{padding:0 16px;gap:18px;}#fs-review .navigation button{font-size:13px;}#fs-review .selection,#fs-review .test-detail{padding:16px;}#fs-review .graph{padding:20px 7px;}#fs-review .graph-grid{grid-template-columns:1fr;grid-template-rows:none;gap:52px;padding-right:48px;}#fs-review .graph-node{grid-column:1!important;grid-row:auto!important;min-height:80px;}#fs-review .button{min-height:43px;}#fs-review .graph-node code{font-size:12px;}#fs-review .graph-lines text{font-size:11px;}#fs-review .footer{padding:16px;}}
#fs-review .flow-heading{margin-bottom:18px;}
#fs-review .flow-canvas{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:85px;padding:20px 38px 20px 20px;background:var(--soft);border:1px solid var(--line);border-radius:10px;}
#fs-review .flow-view{position:relative;z-index:2;}
#fs-review .flow-modules{display:flex;flex-direction:column;gap:17px;padding-top:36px;}
#fs-review .flow-module{position:relative;z-index:2;display:block;text-align:left;width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:8px;background:var(--surface);}
#fs-review .flow-module code{display:block;margin:5px 0;}
#fs-review .flow-module.executing{background:var(--amberbg);border:2px solid var(--amber);padding:12px 14px;}
#fs-review .flow-module[aria-pressed=true]{box-shadow:0 0 0 2px var(--accent);}
#fs-review .flow-state{display:block;white-space:pre-line;font-size:12px;color:var(--dim);}
#fs-review .flow-active-label{display:block;font-size:11px;color:var(--amber);margin-top:5px;}
#fs-review [data-flow-active=true]{outline:2px solid #edc489;outline-offset:2px;}
#fs-review .flow-overlay{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible;}
#fs-review .flow-overlay path{fill:none;stroke:var(--amber);stroke-width:2;}
#fs-review .flow-overlay path.lost{stroke-dasharray:6 5;}
#fs-review .flow-overlay circle{fill:var(--surface);stroke:var(--amber);stroke-width:1.5;}
#fs-review .flow-overlay text{fill:var(--text);font:12px -apple-system,BlinkMacSystemFont,sans-serif;}
#fs-review .flow-trace{padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:9px;margin-top:18px;}
#fs-review .flow-track{display:flex;gap:7px;margin:18px 0 0;}
#fs-review .flow-track button{flex:1;min-height:34px;border:0;border-radius:5px;background:var(--base);color:var(--dim);}
#fs-review .flow-track button.visited{background:var(--soft);color:var(--accent);}
#fs-review .flow-track button[aria-pressed=true]{background:var(--amberbg);color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber);}
#fs-review .flow-path-list{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0;}
#fs-review .flow-path-list>span{font-size:12px;overflow-wrap:anywhere;}
#fs-review .flow-path-list b{font-weight:500;color:var(--amber);margin-right:4px;}
#fs-review .flow-path-list small{display:block;color:var(--dim);padding-left:14px;}
#fs-review .flow-deltas{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px;}
#fs-review .flow-deltas th,#fs-review .flow-deltas td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;}
#fs-review .flow-deltas th{color:var(--dim);font-weight:500;}
#fs-review .flow-deltas td:last-child{background:var(--soft);}
@media(max-width:800px){#fs-review .flow-canvas{grid-template-columns:minmax(0,1fr) 230px;gap:45px;padding:15px 30px 15px 15px;}#fs-review .flow-view .echo-inner{padding:15px 10px;}#fs-review .flow-module{padding:10px;}#fs-review .flow-module.executing{padding:9px;}#fs-review .flow-view .echo-actions{flex-wrap:wrap;}#fs-review .flow-view .compare-label{display:block;}}
@media(max-width:600px){#fs-review .flow-canvas{grid-template-columns:1fr;padding:16px 38px 16px 16px;gap:10px;}#fs-review .flow-modules{padding-top:5px;}#fs-review .flow-trace{padding:15px;}#fs-review .flow-track{flex-wrap:wrap;}#fs-review .flow-track button{flex:1 1 15%;}#fs-review .flow-deltas{font-size:12px;}}

#fs-review{--fn:light-dark(#6541a5,#d4b5ff);--type:light-dark(#096b78,#8bd4df);--keyword:light-dark(#93418c,#e7a8df);--string:light-dark(#38662c,#afd59b);--literal:light-dark(#955016,#edbd88);}

#fs-review{position:relative;}
#fs-review .flow-module,#fs-review .flow-module.executing{padding:14px;border-width:1px;}
#fs-review .flow-module.executing{box-shadow:inset 0 0 0 1px var(--amber);}
#fs-review .flow-module code.symbol,#fs-review .graph-node code.symbol{padding:0!important;margin:8px 0!important;text-indent:0;text-align:left;}
#fs-review .module-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
#fs-review .origin{display:inline-block;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;line-height:1.5;}
#fs-review .origin.existing{background:var(--codebg);color:var(--dim);}
#fs-review .origin.modified{background:var(--amberbg);color:var(--amber);}
#fs-review .origin.added{background:var(--soft);color:var(--accent);}
#fs-review .module-description{display:block;font-size:12px;line-height:1.65;color:var(--dim);margin:0 0 10px;padding:0;text-align:left;}
#fs-review .state-group{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
#fs-review .state-badge{display:inline-flex;align-items:stretch;max-width:100%;border:1px solid var(--line);border-radius:5px;overflow:hidden;font-size:12px;line-height:1.6;background:var(--surface);color:var(--text);vertical-align:middle;}
#fs-review .state-badge .state-key{padding:3px 7px;background:var(--codebg);color:var(--dim);overflow-wrap:anywhere;}
#fs-review .state-badge strong{padding:3px 7px;font-weight:600;overflow-wrap:anywhere;}
#fs-review .state-badge.changed{border-color:var(--amber);}
#fs-review .state-badge.changed strong{background:var(--amberbg);color:var(--amber);}
#fs-review .flow-deltas td:last-child{background:transparent;}
#fs-review .flow-path-list>span{display:grid;grid-template-columns:18px minmax(0,1fr);column-gap:6px;align-items:start;}
#fs-review .flow-path-list small{grid-column:2;padding-left:0;}
#fs-review .graph-node{text-align:left;}
#fs-review .graph-node small{padding:0;margin:0;}
#fs-review .graph-grid{grid-template-rows:repeat(5,minmax(145px,auto));}
#fs-review .function-popup{position:absolute;z-index:20;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 8px 28px light-dark(#26313d26,#0008);overflow-wrap:anywhere;}
#fs-review .function-popup[hidden]{display:none;}
#fs-review .popup-heading{display:flex;gap:6px;align-items:center;margin-bottom:10px;}
#fs-review .function-popup h4 code{padding:0!important;}
#fs-review .function-popup p{font-size:13px;margin:8px 0 14px;}
#fs-review .popup-contract+.popup-contract{margin-top:14px;}

/* Preserve the existing FS palette and system/monospace families; approved layout stays intact. */

#fs-review .flow-overlay,#fs-review .graph-lines{overflow:visible;pointer-events:none;}
#fs-review .graph-lines circle{fill:var(--surface);stroke:var(--dim);}
#fs-review .graph-lines text{fill:var(--text);font:11px ui-monospace,monospace;}
#fs-review .function-popup{max-height:min(70vh,600px);overflow:auto;}
#fs-review .origin.unknown{background:var(--codebg);color:var(--dim);}
#fs-review .footer{gap:12px;flex-wrap:wrap;}
#fs-review .field-owner>code.symbol,#fs-review .field-identity{margin-left:0;padding-left:0;}
#fs-review [data-storage-status]:empty,#fs-review [data-route-status]:empty{display:none;}
@media(max-width:600px){#fs-review .flow-canvas{padding-right:38px;}#fs-review .graph-grid{padding-right:40px;gap:36px;}#fs-review .flow-track{flex-wrap:wrap;}#fs-review .flow-deltas{table-layout:fixed;}#fs-review .flow-deltas td,#fs-review .flow-deltas th{overflow-wrap:anywhere;}#fs-review .navigation{gap:16px;}}

html,body{margin:0}body{padding:16px;background:light-dark(#f8f9fb,#181d23)}
#fs-review h2,#fs-review h3,#fs-review h4,#fs-review p,#fs-review li{font-family:inherit;}
#fs-review code.symbol{color:light-dark(#69768a,#c6b8e9);}

#fs-review .capture-screen{position:relative}#fs-review .capture-screen img{display:block;width:100%;height:auto}#fs-review .capture-region{position:absolute;border:1px dashed var(--amber);background:transparent}

// Deterministic orthogonal routes. All coordinates are CSS pixels relative to the canvas.
function reviewRoute(from,to,obstacles,lane=0) {
  const gap=8+(lane%4)*3;
  const sameColumn=Math.abs(from.left-to.left)<30;
  const side=sameColumn?'right':from.right<=to.left?'right':from.left>=to.right?'left':from.top<to.top?'bottom':'top';
  const targetSide=sameColumn?'right':side==='right'?'left':side==='left'?'right':side==='bottom'?'top':'bottom';
  const fraction=.35+(lane%4)*.1;
  const port=(r,s)=>s==='right'?[r.right,r.top+r.height*fraction]:s==='left'?[r.left,r.top+r.height*fraction]:s==='top'?[r.left+r.width*fraction,r.top]:[r.left+r.width*fraction,r.bottom];
  const offset=(p,s)=>[p[0]+(s==='right'?gap:s==='left'?-gap:0),p[1]+(s==='bottom'?gap:s==='top'?-gap:0)];
  const start=port(from,side),end=port(to,targetSide),a=offset(start,side),b=offset(end,targetSide);
  const boxes=obstacles.map(r=>({left:r.left-3,right:r.right+3,top:r.top-3,bottom:r.bottom+3}));
  const inside=(x,y)=>boxes.some(r=>x>r.left&&x<r.right&&y>r.top&&y<r.bottom);
  const clear=(p,q)=>!boxes.some(r=>p[0]===q[0]?p[0]>r.left&&p[0]<r.right&&Math.max(p[1],q[1])>r.top&&Math.min(p[1],q[1])<r.bottom:p[1]>r.top&&p[1]<r.bottom&&Math.max(p[0],q[0])>r.left&&Math.min(p[0],q[0])<r.right);
  const xs=[...new Set([a[0],b[0],...obstacles.flatMap(r=>[r.left-gap,r.right+gap])])].sort((a,b)=>a-b);
  const ys=[...new Set([a[1],b[1],...obstacles.flatMap(r=>[r.top-gap,r.bottom+gap])])].sort((a,b)=>a-b);
  const key=(x,y)=>x+','+y,goal=key(b[0],b[1]),first=key(a[0],a[1]);
  const queue=[{p:a,cost:0}],costs=new Map([[first,0]]),previous=new Map();
  while(queue.length){queue.sort((u,v)=>(v.cost+Math.abs(v.p[0]-b[0])+Math.abs(v.p[1]-b[1]))-(u.cost+Math.abs(u.p[0]-b[0])+Math.abs(u.p[1]-b[1])));const cur=queue.pop(),k=key(...cur.p);if(cur.cost!==costs.get(k))continue;if(k===goal)break;

    }
  }

  const points=[b];let k=goal;while(k!==first){k=previous.get(k);if(!k)return null;points.push(k.split(',').map(Number));}points.reverse();points.unshift(start);points.push(end);
  const compact=points.filter((p,i)=>!i||i===points.length-1||!((points[i-1][0]===p[0]&&points[i+1][0]===p[0])||(points[i-1][1]===p[1]&&points[i+1][1]===p[1])));
  return {points:compact,path:compact.map((p,i)=>(i?'L':'M')+p.join(',')).join(' ')};
}

function highlight(value){

function popupMarkup(id){const info=moduleInfo(id);return `<div class="popup-heading">${originBadge(id)}<span class="small dim">interface 발췌</span></div><h4><code class="symbol">${esc(info.name)}</code></h4><p>${esc(info.description)}</p>${info.contracts.slice(0,1).map(i=>`<div class="popup-contract"><span class="small dim">${esc(i.title)} · ${esc(i.status)}</span>${codeBlock(signature(i))}</div>`).join('')}<button class="button" data-tab="domain">도메인·계약 전체</button>`;}
let popupAnchor=null,popupTimer;
function closeFunctionPopup(){clearTimeout(popupTimer);const popup=root.querySelector('.function-popup');if(popup)popup.hidden=true;popupAnchor?.removeAttribute('aria-describedby');popupAnchor=null;}
function showFunctionPopup(anchor){
 clearTimeout(popupTimer);if(!anchor)return;
 const popup=root.querySelector('.function-popup');if(!popup)return;
 popupAnchor?.removeAttribute('aria-describedby');popupAnchor=anchor;
 popup.innerHTML=popupMarkup(anchor.dataset.function);popup.hidden=false;anchor.setAttribute('aria-describedby','fs-function-popup');
 const box=root.getBoundingClientRect(),target=anchor.getBoundingClientRect();
 popup.style.width=Math.min(460,box.width-24)+'px';
 const width=popup.getBoundingClientRect().width,height=popup.getBoundingClientRect().height;
 const left=target.left-box.left-width-12;
 popup.style.left=Math.max(12,Math.min(box.width-width-12,left>=12?left:target.left-box.left))+'px';
 const top=left>=12?target.top:target.bottom+8;popup.style.top=(Math.max(8,Math.min(innerHeight-height-8,top))-box.top)+'px';
}
root.addEventListener('pointerover',e=>{if(e.target.closest('.function-popup')){clearTimeout(popupTimer);return;}const anchor=e.target.closest('[data-function]');if(anchor&&anchor!==popupAnchor)showFunctionPopup(anchor);});
root.addEventListener('pointerout',e=>{if(e.target.closest('[data-function],.function-popup')&&!e.relatedTarget?.closest?.('[data-function],.function-popup'))popupTimer=setTimeout(closeFunctionPopup,220);});
root.addEventListener('focusin',e=>{const anchor=e.target.closest('[data-function]');if(anchor)showFunctionPopup(anchor);else if(!e.target.closest('.function-popup'))closeFunctionPopup();});
root.addEventListener('focusout',e=>{if(!e.relatedTarget?.closest?.('[data-function],.function-popup'))closeFunctionPopup();});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){const anchor=popupAnchor;anchor?.focus();closeFunctionPopup();}});
root.addEventListener('pointerdown',e=>{if(!e.target.closest('[data-function],.function-popup'))closeFunctionPopup();});

function testView(){const t=effectiveTest(T.find(t=>t.id===s.test)||T[0]),list=arr=>`<ul>${arr.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`;return `<div class="test-workspace"><nav class="test-nav" aria-label="테스트 시나리오">${[...new Set(T.map(t=>t.runner))].map(r=>`<h4>${esc(r)}</h4>${T.filter(t=>t.runner===r).map(t=>`<button data-test="${t.id}" aria-pressed="${s.test===t.id}"><small>${esc(t.id)} · ${s.confirmed.includes(t.id)?'계획 확인됨':'확인 대기'}</small>${esc(t.title)}</button>`).join('')}`).join('')}</nav><article class="test-detail"><div class="row spread"><span class="badge">${esc(t.runner)} · ${esc(t.layer)}</span><span class="badge warn">실행 전</span></div><h3 style="margin-top:13px">${esc(t.title)}</h3>${rules(t.ruleIds)}<section><h4>준비 조건 · Given</h4>${list(t.given)}</section><section><h4>장애 주입과 행동 · When</h4><ol>${t.when.map(v=>`<li>${esc(v)}</li>`).join('')}</ol></section><section><h4>통과 조건 · Then</h4><ul class="checks">${t.then.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></section><section><h4>환경 · mock · 데이터 격리</h4>${list(t.setup)}</section><section><h4>반증 · 실패해야 하는 변경</h4><p>${esc(t.mutation)}</p></section><section><h4>검증 한계</h4><p>${esc(t.limits)}</p></section><label class="test-confirm"><input type="checkbox" data-confirm="${t.id}" ${s.confirmed.includes(t.id)?'checked':''}><span>규칙·통과 조건·검증 범위를 확인했습니다.<br><span class="small dim">테스트 계획 확인 · 실행 결과 아님</span></span></label></article></div>`;}
function render(){closeFunctionPopup();app.innerHTML=`<header class="header"><div class="brand"><b>fs</b> Frontend System <span class="dim small">/ ${esc(M.projectLabel)}</span></div><span class="small dim">${esc(M.sourceCommit.slice(0,7))} 기준 · ${M.basis==='proposed'?'설계 제안':'관측'}${M.freshness&&M.freshness!=='current'?' · '+esc(M.freshness):''} · 검토 v${s.revision}</span></header><div class="heading"><h2>${esc(M.title)}</h2></div><nav class="navigation" aria-label="설계 검토">${[['screen','흐름'],['domain','도메인·계약'],['graph','의존성'],['tests','테스트 계획']].map(([id,label])=>`<button data-tab="${id}" aria-pressed="${s.tab===id}">${label}</button>`).join('')}</nav><main class="content"><div data-storage-status class="${s.notice?'notice':''}" role="status">${esc(s.notice)}</div>${s.tab==='screen'?flowScreen():s.tab==='domain'?domainView():s.tab==='graph'?graphView():testView()}<details class="json-data"><summary class="small dim">기반 JSON</summary><pre>${esc(JSON.stringify(s.tab==='tests'?effectiveTest(T.find(t=>t.id===s.test)):s.tab==='graph'?G:s.tab==='domain'?{domain:M.domain,rules:R,contracts:I.map(i=>({...i,signature:signature(i)}))}:flowStep(),null,2))}</pre></details></main><footer class="footer"><span>검증 계획 ${s.confirmed.length} / ${T.length} 확인 · 실제 실행 0</span><span class="row"><button class="button" data-action="import">초안 불러오기</button><input hidden type="file" accept="application/json,.json" data-draft-file><button class="button" data-action="export">초안 JSON 내보내기</button><button class="button primary" data-action="approve" ${s.confirmed.length!==T.length||s.approved===s.revision?'disabled':''}>${s.approved===s.revision?'이 버전의 테스트 계획 확인됨':'테스트 계획 확인 완료'}</button></span></footer><aside class="function-popup" id="fs-function-popup" role="dialog" aria-label="함수 계약" hidden></aside>`;requestAnimationFrame(()=>s.tab==='graph'?drawGraph():s.tab==='screen'?drawFlow():null);}
function exportDraft(){const url=URL.createObjectURL(new Blob([JSON.stringify({flowHash:M.flowHash,version:M.version,state:{...s,editing:false}},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=M.flowId+'-review-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;let focus='';
 if(b.dataset.flowStep!==undefined){s.flowIndex=Number(b.dataset.flowStep);s.flowNode=flowStep().links.at(-1).to;focus=`[data-flow-step="${s.flowIndex}"]`;}
 else if(b.dataset.flowInspect){s.flowNode=b.dataset.flowInspect;focus=`[data-flow-inspect="${s.flowNode}"]`;}
 else if(b.dataset.tab){s.tab=b.dataset.tab;focus=`[data-tab="${s.tab}"]`;}
 else if(b.dataset.region){s.region=b.dataset.region;s.flowNode=null;focus=`[data-region="${s.region}"]`;}
 else if(b.dataset.rule){s.rule=b.dataset.rule;s.tab='domain';focus='[data-tab="domain"]';}
 else if(b.dataset.test){s.test=b.dataset.test;s.tab='tests';focus=`[data-test="${s.test}"]`;}
 else if(b.dataset.graphNode){s.node=b.dataset.graphNode;focus=`[data-graph-node="${s.node}"]`;}
 else{const a=b.dataset.action;
  if(a==='export'){exportDraft();return;}
  if(a==='import'){root.querySelector('[data-draft-file]').click();return;}
  if(a==='flow-next'||a==='flow-prev'){s.flowIndex=Math.max(0,Math.min(steps().length-1,s.flowIndex+(a==='flow-next'?1:-1)));s.flowNode=flowStep().links.at(-1).to;}
  if(a==='edit')s.editing=true;if(a==='cancel')s.editing=false;
  if(a==='approve'&&s.confirmed.length===T.length){s.approved=s.revision;s.notice=`v${s.revision} 테스트 계획 확인 완료. 로컬 검토 초안 · 실행 증거는 별도입니다.`;}
  if(a==='apply'){
   const values=Object.fromEntries(M.edits.map(v=>[v.id,root.querySelector(`[data-edit="${v.id}"]`).value.trim()])),reason=root.querySelector('[data-field="reason"]').value.trim();
   if(!reason||M.edits.some(v=>!values[v.id]||values[v.id].length>v.maxLength)){root.querySelector('[data-error]').textContent='문구·결정 이유와 입력 길이를 확인하세요.';return;}
   const changed=M.edits.filter(v=>values[v.id]!==s.edits[v.id]);if(!changed.length){root.querySelector('[data-error]').textContent='변경된 내용이 없습니다.';return;}
   const affected=new Set(changed.flatMap(v=>v.testIds));s.edits=values;s.reason=reason;s.revision++;s.confirmed=s.confirmed.filter(id=>!affected.has(id));s.approved=0;s.editing=false;s.notice=`v${s.revision} 변경 반영 · ${[...affected].join(', ')} 재확인 필요 · ${reason}`;
  }
  focus=(a==='flow-next'||a==='flow-prev')?`[data-flow-step="${s.flowIndex}"]`:s.editing?'[data-edit]':`[data-tab="${s.tab}"]`;
 }
 render();persist();root.querySelector(focus)?.focus();if(b.dataset.rule)root.querySelector(`[id="rule-${s.rule}"]`)?.scrollIntoView({block:'nearest'});
 // Touch/click opens the same contract as hover and keyboard focus.
 if(b.dataset.function){const anchor=root.querySelector(`[data-function="${b.dataset.function}"]`);showFunctionPopup(anchor);}
});
root.addEventListener('change',async e=>{if(e.target.matches('[data-draft-file]')){const file=e.target.files[0];if(!file)return;try{if(file.size>200000)throw new Error('초안 파일 크기가 너무 큽니다.');const draft=JSON.parse(await file.text());if(draft.flowHash!==M.flowHash||draft.version!==M.version)throw new Error('다른 흐름 또는 버전의 초안입니다.');if(!restore(draft))throw new Error('유효하지 않은 검토 초안입니다.');s.notice='로컬 검토 초안을 불러왔습니다. 실행 결과·서버 승인이 아닙니다.';render();persist();}catch(error){s.notice='초안 복원 실패: '+error.message;render();}return;}if(e.target.matches('[data-scenario]')){s.scenario=e.target.value;s.flowIndex=0;render();persist();return;}const id=e.target.dataset.confirm;if(!id||!T.some(t=>t.id===id))return;s.confirmed=e.target.checked?[...new Set([...s.confirmed,id])]:s.confirmed.filter(v=>v!==id);s.approved=0;render();persist();root.querySelector(`[data-confirm="${id}"]`)?.focus();});
function drawConnections(container,svgSelector,groupSelector,links,attribute,marker){
 const canvas=root.querySelector(container);if(!canvas)return;
 const svg=canvas.querySelector(svgSelector),group=canvas.querySelector(groupSelector),origin=canvas.getBoundingClientRect();
 const rect=element=>{const r=element.getBoundingClientRect();return {left:r.left-origin.left,right:r.right-origin.left,top:r.top-origin.top,bottom:r.bottom-origin.top,width:r.width,height:r.height};};
 const elements=[...canvas.querySelectorAll(`[${attribute}]`)];
 const obstacles=[...new Set([...elements,...canvas.querySelectorAll('.partner,.orb')])].filter(el=>el.getBoundingClientRect().width>0).map(rect);
 const missing=[],labels=[];
 const markup=links.map((edge,i)=>{
  const a=elements.find(el=>el.getAttribute(attribute)===edge.from),b=elements.find(el=>el.getAttribute(attribute)===edge.to);
  if(!a||!b){missing.push(edge.label);return '';}
  const route=reviewRoute(rect(a),rect(b),obstacles,i);
  if(!route){missing.push(edge.label);return '';}
  let label;
  const segments=route.points.slice(1).map((q,i)=>({p:route.points[i],q,length:Math.abs(q[0]-route.points[i][0])+Math.abs(q[1]-route.points[i][1])})).sort((a,b)=>b.length-a.length);
  for(const seg of segments){for(const t of [.5,.35,.65,.2,.8]){const p=[seg.p[0]+(seg.q[0]-seg.p[0])*t,seg.p[1]+(seg.q[1]-seg.p[1])*t];if(!obstacles.some(r=>p[0]>r.left-11&&p[0]<r.right+11&&p[1]>r.top-11&&p[1]<r.bottom+11)&&!labels.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<25)){label=p;break;}}if(label)break;}
  if(label)labels.push(label);
  const lost=edge.delivery==='lost';
  return `<g data-edge="${esc(edge.id)}" data-from="${edge.from}" data-to="${edge.to}" data-points="${esc(JSON.stringify(route.points))}"><title>${i+1}. ${esc(edge.label)}${lost?' · 응답 유실':''}</title><path class="${lost?'lost':''} ${edge.from===s.node||edge.to===s.node?'focus-edge':''}" d="${route.path}" ${lost?'':`marker-end="url(#${marker})"`}/>${label?`<circle cx="${label[0]}" cy="${label[1]}" r="10"/><text x="${label[0]}" y="${label[1]+4}" text-anchor="middle">${lost?'×':i+1}</text>`:''}</g>`;
 }).join('');
 group.innerHTML=markup;
 const bounds=group.getBBox(),pad=16;
 const left=Math.min(0,bounds.x-pad),top=Math.min(0,bounds.y-pad),right=Math.max(origin.width,bounds.x+bounds.width+pad),bottom=Math.max(origin.height,bounds.y+bounds.height+pad);
 svg.setAttribute('viewBox',`${left} ${top} ${right-left} ${bottom-top}`);
 Object.assign(svg.style,{left:left+'px',top:top+'px',width:(right-left)+'px',height:(bottom-top)+'px'});
 const status=root.querySelector('[data-route-status]');if(status)status.textContent=missing.length?'연결 경로 확인 필요: '+missing.join(', '):'';
}
function drawFlow(){drawConnections('.flow-canvas','.flow-overlay','[data-flow-paths]',flowStep().links,'data-flow-endpoint','fs-flow-arrow');}
function drawGraph(){drawConnections('.graph-grid','.graph-lines','[data-graph-paths]',G.edges,'data-graph-node','fs-arrow');}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>requestAnimationFrame(()=>s.tab==='graph'?drawGraph():s.tab==='screen'?drawFlow():null)).observe(app);
window.addEventListener('resize',()=>{closeFunctionPopup();if(s.tab==='graph')drawGraph();if(s.tab==='screen')drawFlow();});
document.fonts?.ready.then(()=>{if(s.tab==='graph')drawGraph();if(s.tab==='screen')drawFlow();});
render();
})();

</script></body></html>
