<div id="app"></div>
<script>
'use strict';
const spec=/*__SPEC__*/;
const assets=/*__ASSETS__*/;
const nodes=new Map(spec.nodes.map(n=>[n.id,n]));
const instances=new Map(spec.instances.map(n=>[n.id,n]));
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let scenario=spec.scenarios.find(s=>s.sourceId===spec.initialScenario)??spec.scenarios[0],stepIndex=0,pageId=spec.pages[0].id,scene=spec.pages[0].scenes[0],selected=spec.pages[0].id,selectedInstance=null,timer=null,regions=[],viewPage=scenario?.steps[0].page??spec.pages[0].id;
function structureView(page,state){
 const definition=spec.pages.find(p=>p.id===page),detail=definition?.sceneDetails?.find(s=>s.id===(state??scene));
 if(spec.basis==='proposed'&&detail?.blocks?.length)return '<div class="wireframe"><div class="wireframe-title"><strong>'+esc(definition.title)+'</strong><small>구조 와이어프레임 · '+esc(detail.title)+'</small></div><p>'+esc(detail.description)+'</p><div class="wireframe-grid">'+detail.blocks.map(block=>'<button class="structure-node wire-block role-'+esc(block.role)+' '+(block.span==='half'?'half':'')+'" data-node="'+block.node+'"><small>'+esc(block.role)+'</small><strong>'+esc(block.label)+'</strong>'+(block.content??[]).map(text=>'<span>'+esc(text)+'</span>').join('')+'</button>').join('')+'</div></div>';
 const blocker=(spec.blocked??[]).find(b=>b.page===page&&b.scene===(state??scene));
 const entries=[{node:page},...spec.instances.filter(i=>i.page===page)];
 return '<div class="structure-view"><p>컴포넌트 구조 · '+(spec.basis==='observed'?'실제 화면 미캡처':'화면 배치 검토 중')+'</p>'+(blocker?'<p>'+esc(blocker.reason)+'</p>':'')+entries.map(i=>{const n=nodes.get(i.node);return '<button class="structure-node" data-node="'+n.id+'"'+(i.id?' data-instance="'+i.id+'"':'')+'><code>'+esc(n.name)+'</code><small>'+esc(n.state.join(' · ')||n.kind)+'</small></button>';}).join('')+'</div>';
}
const params=new URLSearchParams(location.search);
if(params.has('capture')){
 document.body.className='capture'; document.querySelector('#app').innerHTML=structureView(params.get('capture'));
}else{
 document.querySelector('#app').innerHTML='<header class="top"><div class="brand"><b>fs</b>Frontend System</div><h1>프로젝트 흐름</h1><span class="badge">'+(spec.basis==='observed'?'관측 코드':'설계 시안')+'</span></header><div class="toolbar"><span class="label">DOMAIN FLOW</span><label for="scenario" class="muted">시나리오</label><select id="scenario"></select><span class="spacer"></span><small>화면 영역에 올리면 정보 보기 · 클릭하면 선택 고정</small></div><main class="workspace"><div class="left"><div class="scene-head"><strong id="scene-title"></strong><button id="routes-toggle" aria-pressed="false">라우트 개요</button><button id="board-toggle" aria-pressed="false">전체 영향 지도</button>'+spec.pages.map(p=>'<button id="page-'+p.id+'" aria-pressed="false">'+esc(p.title??nodes.get(p.id).name)+'</button>').join('')+'</div><section class="canvas" aria-label="화면과 외부 의존성"><div class="screen-wrap"><div class="screen-bar"><span id="route"></span><span id="screen-state"></span></div><div class="screen-port" id="screen"></div></div><div class="external" id="external"></div><svg class="overlay" aria-hidden="true"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" style="fill:var(--flow-color);stroke:none;animation:none"/></marker></defs><path id="trace-path" marker-end="url(#arrow)"/><circle id="start-dot" r="5"/></svg></section><div class="legend"><span>현재 이벤트의 출발·도착</span><span>선택한 컴포넌트</span></div><section class="trace" aria-label="이벤트 재생"><div class="trace-head"><span class="step-count" id="count"></span><strong id="effect"></strong><div class="controls"><button id="prev" aria-label="이전 단계">←</button><button id="play">자동 재생</button><button id="next" aria-label="다음 단계">→</button></div></div><div id="track" class="track"></div><p class="effect"><code id="event-label"></code></p><div class="delta"><div><span>BEFORE · 관련 상태</span><pre id="before"></pre></div><div><span>AFTER · 관련 상태</span><pre id="after"></pre></div></div><p id="guard" class="scenario-warning"></p><div id="changes"></div></section></div><aside class="inspector" aria-label="선택한 컴포넌트 정보" id="inspector"></aside></main><footer class="footer"><a href="'+esc(spec.modelFile??'rendered-model.json')+'">자료 구조</a></footer>';
 document.querySelector('#scenario').onchange=e=>{stop();scenario=spec.scenarios.find(s=>s.id===e.target.value);stepIndex=0;routeScope=scenario.pages;updateRouteTabs();syncStep();};
 document.querySelector('#next').onclick=()=>{stop();advance(1);};document.querySelector('#prev').onclick=()=>{stop();advance(-1);};
 document.querySelector('#play').onclick=()=>{if(timer){stop();return;}if(stepIndex===scenario.steps.length-1)stepIndex=0;syncStep();timer=setInterval(()=>{if(stepIndex===scenario.steps.length-1){stop();return;}advance(1);},2000);document.querySelector('#play').textContent='일시 정지';};
 for(const page of spec.pages)document.querySelector('#page-'+page.id).onclick=()=>{stop();viewPage=page.id;pageId=page.id;refreshScenarios();setBoard(false);syncStep();};
 new ResizeObserver(()=>{scaleMock();drawTrace();}).observe(document.querySelector('.canvas'));
 const casePanel=document.createElement('section');casePanel.id='scenario-cases';casePanel.setAttribute('aria-label','계획 테스트 사례');document.querySelector('#changes').after(casePanel);
 if(spec.freshness&&spec.freshness!=='current'){const note=document.createElement('p');note.textContent='분석 대상 변경됨 · '+spec.freshness;document.querySelector('.footer').append(note);}
 refreshScenarios();syncStep();
}
function refreshScenarios(){
 const available=spec.scenarios.filter(s=>!viewPage||s.pages.includes(viewPage));
 if(!available.includes(scenario)){scenario=available[0]??null;stepIndex=0;}
 const select=document.querySelector('#scenario');select.replaceChildren();
 for(const basis of ['observed','proposed'])for(const category of ['lifecycle','event']){
  const items=available.filter(s=>s.basis===basis&&s.category===category);if(!items.length)continue;
  const group=document.createElement('optgroup');group.label=(basis==='observed'?'관측':'계획')+' · '+(category==='lifecycle'?'라이프사이클':'이벤트');
  for(const item of items){const option=new Option(item.title+(item.variant?' · '+variantName(item.variant):''),item.id);group.append(option);}select.append(group);
 }
 select.disabled=!scenario;
 if(scenario)select.value=scenario.id;else select.add(new Option('기록된 흐름 없음',''));
}
function variantName(kind){return ({idle:'기본',loading:'로딩',success:'성공',empty:'빈 결과',error:'실패',cancelled:'취소',retry:'재시도',custom:'흐름'})[kind]??kind;}
function current(){return scenario?.steps[stepIndex];}
function stop(){clearInterval(timer);timer=null;document.querySelector('#play').textContent='자동 재생';}
function advance(delta){stepIndex=Math.max(0,Math.min(scenario.steps.length-1,stepIndex+delta));syncStep();}
function syncStep(){const s=current();document.body.dataset.variant=scenario?.variant??'custom';
 document.querySelector('.badge').textContent=scenario?(scenario.basis==='observed'?'관측 흐름':'계획 흐름'):'기록된 흐름 없음';
 if(!s){scene=spec.pages.find(p=>p.id===pageId).scenes[0];selected=pageId;selectedInstance=null;document.querySelector('.trace').hidden=true;renderScreen();renderInspector();requestAnimationFrame(drawTrace);return;}
 document.querySelector('.trace').hidden=false;
 document.querySelector('#scenario-cases').replaceChildren(...(scenario.testCases??[]).map(item=>{const row=document.createElement('p');row.textContent=(item.sourceId??item.id)+' · 계획 테스트 · '+item.expected;return row;}));
 pageId=viewPage??s.page;scene=sceneAt(pageId);selected=s.toNode;selectedInstance=spec.instances.find(i=>i.page===pageId&&i.node===selected)?.id??null;renderScreen();renderInspector();document.querySelector('#count').textContent=String(stepIndex+1).padStart(2,'0')+' / '+scenario.steps.length;document.querySelector('#event-label').textContent=s.label;document.querySelector('#effect').textContent=(s.page!==pageId?(spec.pages.find(p=>p.id===s.page).title??nodes.get(s.page).name)+' · ':'')+s.effect;document.querySelector('.delta').hidden=Boolean(s.changes);document.querySelector('#before').textContent=JSON.stringify(s.before,null,2)??'—';document.querySelector('#after').textContent=JSON.stringify(s.after,null,2)??'—';renderChanges(s);document.querySelector('#guard').textContent=s.guard?'조건 · '+s.guard:'';document.querySelector('#prev').disabled=stepIndex===0;document.querySelector('#next').disabled=stepIndex===scenario.steps.length-1;document.querySelector('#track').innerHTML=scenario.steps.map((s,i)=>'<button class="'+(i===stepIndex?'current':i<stepIndex?'past':'')+'" data-step="'+i+'" aria-label="'+(i+1)+'단계 '+esc(s.effect+' · '+s.label)+'" '+(i===stepIndex?'aria-current="step"':'')+'></button>').join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{stop();stepIndex=Number(b.dataset.step);syncStep();});if(document.querySelector('#board-viewport'))renderBoard();requestAnimationFrame(drawTrace);}
function renderScreen(){
 const asset=assets[pageId+':'+scene],screen=document.querySelector('#screen');screen.dataset.node=pageId;
 document.querySelector('#scene-title').textContent=nodes.get(pageId).name;document.querySelector('#route').textContent=spec.pages.find(p=>p.id===pageId).route;document.querySelector('#screen-state').textContent=(spec.pages.find(p=>p.id===pageId).sceneDetails?.find(d=>d.id===scene)?.title??scene)+' · '+(asset?(asset.kind==='mockup'?'시안':spec.basis==='observed'?(scenario?.basis==='proposed'?'기준 화면 · 계획 흐름':'실행 화면'):'기준 실행 화면 · 설계 흐름'):(spec.basis==='proposed'&&spec.pages.find(p=>p.id===pageId).sceneDetails?.find(d=>d.id===scene)?.blocks?.length?'구조 와이어프레임':'미캡처 · 컴포넌트 구조'));
 for(const page of spec.pages)document.querySelector('#page-'+page.id).setAttribute('aria-pressed',String(document.querySelector('#board-toggle').getAttribute('aria-pressed')!=='true'&&pageId===page.id));
 screen.style.aspectRatio=asset?asset.width+'/'+asset.height:'760/570';
 screen.innerHTML=asset?'<img class="screen-image" src="'+asset.image+'" alt="'+esc(nodes.get(pageId).name)+'의 '+esc(scene)+' 상태">':structureView(pageId);
 scaleMock();
 regions=asset?asset.regions:[];
 screen.querySelectorAll('.structure-node').forEach(button=>{
  button.onmouseenter=()=>renderInspector(button.dataset.node,button.dataset.instance??null);
  button.onmouseleave=()=>renderInspector();button.onfocus=button.onmouseenter;button.onblur=button.onmouseleave;
  button.onclick=()=>{selected=button.dataset.node;selectedInstance=button.dataset.instance??null;renderInspector();highlight();};
 });
 // Parent surfaces are behind their child instances; both remain keyboard-accessible.
 for(const region of [...regions].sort((a,b)=>b.width*b.height-a.width*a.height)){
  const inst=instances.get(region.instance),node=nodes.get(inst.node),button=document.createElement('button');button.className='hotspot';button.dataset.node=node.id;button.dataset.instance=inst.id;button.setAttribute('aria-label',node.name+' · '+inst.id);button.style.cssText='left:'+region.x*100+'%;top:'+region.y*100+'%;width:'+region.width*100+'%;height:'+region.height*100+'%;';button.innerHTML='<span class="tip">'+esc(node.name)+'</span>';
  button.onmouseenter=()=>renderInspector(node.id,inst.id);button.onmouseleave=()=>renderInspector();button.onfocus=()=>renderInspector(node.id,inst.id);button.onblur=()=>renderInspector();button.onclick=()=>{selected=node.id;selectedInstance=inst.id;renderInspector();highlight();};screen.append(button);
 }
 const externalIds=externalNodes();
 document.querySelector('#external').innerHTML=externalIds.map(id=>{const n=nodes.get(id);return '<button data-node="'+id+'"><span class="kind">'+esc(n.kind)+'</span><code>'+esc(n.name)+'</code><small>'+esc(n.state[0]??n.events[0])+'</small></button>';}).join('');
 document.querySelectorAll('#external button').forEach(b=>b.onclick=()=>{selected=b.dataset.node;selectedInstance=null;renderInspector();highlight();});highlight();
}
function scaleMock(){const mock=document.querySelector('.screen-scale');if(mock)mock.style.transform='scale('+document.querySelector('#screen').clientWidth/760+')';}
function highlight(){const effects=stepEffects(current());document.querySelectorAll('.hotspot,.structure-node,#external button,.board-node').forEach(b=>{b.classList.toggle('active',effects.some(s=>(s.fromInstance?b.dataset.instance===s.fromInstance:b.dataset.node===s.fromNode)||(s.toInstance?b.dataset.instance===s.toInstance:b.dataset.node===s.toNode)));b.classList.toggle('selected',b.dataset.instance?b.dataset.instance===selectedInstance:b.dataset.node===selected);});}
function renderInspector(id=selected,instanceId=selectedInstance){
 const n=nodes.get(id),inst=instances.get(instanceId),ownerPage=inst?.page??pageId;
 const sections=[['STATE · 내부 상태',n.state],['EVENT / HANDLER',n.events],['LIFECYCLE',n.lifecycle],['PROPS',n.props]];
 const framework=n.framework;
 document.querySelector('#inspector').innerHTML='<div class="inspector-head"><p class="overline">CODE CONTRACT INSPECTOR</p><h2>'+esc(n.name)+'</h2><p class="instance">'+esc(n.kind)+' · '+esc(inst?(inst.sourceId??inst.id)+(inst.entityKey?' / key: '+inst.entityKey:''):'공유 정의')+'</p></div><div class="inspector-body">'+(framework?'<div class="framework"><strong>'+esc(framework.execution)+'</strong><p>'+esc(framework.name)+'</p><small>'+esc(framework.reason)+'</small></div>':'')+(n.signature?'<div class="inspect-section"><h3>INTERFACE / FUNCTION</h3><pre class="contract">'+esc(n.signature)+'</pre></div>':'')+(n.intent?'<p class="intent">'+esc(n.intent)+'</p>':'')+sections.filter(([,values])=>values.length).map(([name,values])=>'<div class="inspect-section"><h3>'+name+'</h3>'+(values.length?'<ul>'+values.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul>':'<small>—</small>')+'</div>').join('')+(framework?'<div class="inspect-section"><h3>HOOKS</h3>'+(framework.hooks.length?'<ul>'+framework.hooks.map(h=>'<li>'+esc(h)+'</li>').join('')+'</ul>':'<small>—</small>')+'</div>':'')+'<div class="inspect-section"><h3>INSTANCE TREE</h3><div class="tree">'+spec.instances.filter(i=>i.page===ownerPage&&(i.node===id||(inst&&(i.id===inst.parentInstance||i.parentInstance===instanceId))||(n.kind==='page'&&!i.parentInstance))).map(i=>'<button data-inspect="'+i.id+'">'+esc(i.sourceId??i.id)+'</button>').join('')+'</div></div><details class="source-note"><summary>근거</summary>'+esc(JSON.stringify(n.evidence))+'</details></div>';
  const captured=(spec.captures??[]).find(c=>c.page===ownerPage&&c.scene===sceneAt(ownerPage));
 if(captured)document.querySelector('.inspector-body').insertAdjacentHTML('beforeend','<details class="source-note"><summary>화면 캡처 근거</summary><p>'+esc(captured.url??captured.kind)+'</p><p>'+esc(captured.capturedAt)+'</p><p>'+esc(captured.sourceCommit??spec.baseline?.commit??'')+'</p><code>'+esc(captured.hash)+'</code></details>');
 const incoming=(spec.relations??[]).filter(e=>e.to===id),outgoing=(spec.relations??[]).filter(e=>e.from===id);
 const contractDetails='<section class="inspect-section"><h3>위치 · 책임 · 의존성</h3><p>'+esc(n.architecture? n.architecture.layer+' · '+n.architecture.runtime:'계층 미기록')+'</p><p>'+esc(n.architecture?.responsibility??'')+'</p>'+incoming.map(e=>'<p>← '+esc(nodes.get(e.from).name)+' · '+esc(e.label)+'</p>').join('')+outgoing.map(e=>'<p>→ '+esc(nodes.get(e.to).name)+' · '+esc(e.label)+'</p>').join('')+'</section>';
 const relevant=(spec.knowledge??[]).filter(k=>k.nodes.includes(id)||k.edges.includes(current()?.edgeId)||k.scenarios.includes(scenario?.id));
 const knowledge='<section class="inspect-section"><h3>설계 근거 · learned</h3>'+(relevant.length?relevant.map(k=>'<article class="knowledge-card"><strong>'+esc(k.title??k.referenceId)+'</strong><span>'+esc(({apply:'적용',keep:'기존 유지','not-applicable':'제외','needs-context':'맥락 확인','needs-decision':'결정 필요'})[k.judgment])+' · '+(k.confirmation==='approved'?'계획 확정':'검토 기록')+'</span><p>'+esc(k.rationale)+'</p><details><summary>출처와 버전</summary><code>'+esc(k.referenceId)+'</code><p>'+esc(k.referenceHash)+'</p><p>'+esc((k.sources??[]).join(', '))+'</p><p>결정: '+esc(k.decisionId??'미확정')+'</p>'+(k.versionStatus==='unavailable'?'<p>현재 설치본과 버전이 다름</p>':'')+'</details></article>').join(''):'<p>연결된 learned 없음</p>')+'</section>';
 const checks=(spec.checks??[]).filter(c=>c.nodes.includes(id)||c.scenarios.includes(scenario?.id));
 document.querySelector('.inspector-body').insertAdjacentHTML('beforeend',contractDetails+knowledge+'<section class="inspect-section"><h3>주의사항 · 확인할 테스트</h3>'+checks.map(c=>'<p>'+esc(c.requirement)+'</p><small>'+esc(c.testCaseIds.join(', '))+'</small>').join('')+'</section>');
 document.querySelectorAll('[data-inspect]').forEach(b=>b.onclick=()=>{selectedInstance=b.dataset.inspect;selected=instances.get(selectedInstance).node;renderInspector();highlight();});
}
function drawTrace(){
 if(params.has('capture'))return;
 const s=current(),canvas=document.querySelector('.canvas'),box=canvas.getBoundingClientRect(),svg=document.querySelector('.overlay');svg.setAttribute('viewBox','0 0 '+box.width+' '+box.height);
 const find=id=>{const matches=[...canvas.querySelectorAll('[data-node]')].filter(el=>el.dataset.node===id);return matches.find(el=>el.dataset.instance==='row-c')??matches[0];};
 if(!s){document.querySelector('#trace-path').setAttribute('d','');document.querySelector('#start-dot').style.display='none';return;}
 const from=find(s.fromNode),to=find(s.toNode),path=document.querySelector('#trace-path'),dot=document.querySelector('#start-dot');
 if(!from||!to){path.setAttribute('d','');dot.style.display='none';return;}
 const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();let x1,x2,y1,y2;
 if(from.closest('#external')&&to.closest('#external')){x1=a.left-box.left;x2=b.left-box.left;y1=a.top+a.height/2-box.top;y2=b.top+b.height/2-box.top;path.setAttribute('d','M'+x1+','+y1+' C'+(x1-27)+','+y1+' '+(x2-27)+','+y2+' '+x2+','+y2);}
 else{x1=a.left+a.width-box.left;y1=a.top+a.height/2-box.top;x2=b.left-box.left;y2=b.top+b.height/2-box.top;if(a.left>b.left){x1=a.left-box.left;x2=b.right-box.left;}const mid=(x1+x2)/2;path.setAttribute('d','M'+x1+','+y1+' C'+mid+','+y1+' '+mid+','+y2+' '+x2+','+y2);}
 dot.style.display='';dot.setAttribute('cx',x1);dot.setAttribute('cy',y1);
}

function externalNodes(){return [...new Set((scenario?.steps??[]).flatMap(s=>stepEffects(s).flatMap(e=>[e.fromNode,e.toNode])))].filter(id=>!['page','component'].includes(nodes.get(id).kind));}
function renderChanges(step){
 document.querySelector('#changes').innerHTML=step.changes?'<p class="change-origin">'+esc(step.measurement??'코드 해석')+'</p><table class="changes"><thead><tr><th>소유자 · 필드</th><th>이전</th><th>이후</th></tr></thead><tbody>'+step.changes.map(c=>'<tr><th><code>'+esc(c.owner)+'.'+esc(c.field)+'</code>'+(c.basis?'<small> · '+esc(({source:'소스 해석',measured:'실행 측정',proposed:'설계 예상'})[c.basis])+'</small>':'')+'</th><td><pre>'+esc(typeof c.before==='string'?c.before:JSON.stringify(c.before))+'</pre></td><td><pre>'+esc(typeof c.after==='string'?c.after:JSON.stringify(c.after))+'</pre></td></tr>').join('')+'</tbody></table>':'';
 if(step.evidence?.length)document.querySelector('#changes').insertAdjacentHTML('beforeend','<details class="source-note"><summary>코드 근거</summary>'+step.evidence.map(e=>'<p>'+esc(e.path)+':'+esc(e.line)+'</p><pre>'+esc(e.quote)+'</pre>').join('')+'</details>');
}
