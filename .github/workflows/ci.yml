name: FS verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - run: git diff --exit-code -- bundle/mcp.js
  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/fixtures/frontend/package-lock.json
      - run: npm ci
        working-directory: test/fixtures/frontend
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: test/fixtures/frontend
      - run: npm run test:frontend
