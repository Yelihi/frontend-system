<script>
(()=>{
const root=document.getElementById('echo-engineering'),app=root.querySelector('.review-app');
const M=JSON.parse(document.getElementById('echo-engineering-data').textContent),X=M.reviewExtension,U=X.uiBaseline,T=X.detailedTests,R=X.domainRules,I=X.interfaces,G=X.dependencyGraph;
let s={tab:'screen',scene:'saving',flowIndex:0,flowNode:'turn',region:'error-feedback',test:'p-db',rule:'R2',node:'turn',revision:1,confirmed:[],approved:0,editing:false,message:U.proposedMessage,saveLabel:U.proposedSaveLabel,reason:'',notice:''};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const source=path=>`https://github.com/Yelihi/echo/blob/${M.baseline.echoCommit}/${path}`;
function restore(v){if(v?.privateContent?.schema==='engineering-2'){s={...s,...v.privateContent.state,editing:false};s.confirmed=s.confirmed.filter(id=>T.some(t=>t.id===id));if(!['screen','domain','graph','tests'].includes(s.tab))s.tab='screen';if(!T.some(t=>t.id===s.test))s.test='p-db';s.flowIndex=Math.max(0,Math.min(8,Number(s.flowIndex)||0));}}
restore(window.openai?.widgetState);
function persist(){window.openai?.setWidgetState?.({modelContent:{prototype:'Echo 개발 설계 검토',selectedTab:s.tab,flowStep:(s.flowIndex??0)+1,selectedTest:s.test,revision:s.revision,message:s.message,saveLabel:s.saveLabel,confirmedTestIds:s.confirmed,decisionReason:s.reason},privateContent:{schema:'engineering-2',state:{...s,editing:false}}}).catch(()=>{});}
// Lightweight display lexer for the prototype's TypeScript contracts and call traces.
function highlight(value){
 const input=String(value), tokens=/\/\/[^\n]*|\/\*[\s\S]*?\*\/|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`|\b[A-Za-z_$][\w$]*\b|\b\d+(?:\.\d+)?\b/g;
 let result='',end=0;
 for(const match of input.matchAll(tokens)){
  const word=match[0],tail=input.slice(match.index+word.length);
  let kind='';
  if(word.startsWith('//')||word.startsWith('/*'))kind='comment';
  else if(/^["'`]/.test(word))kind='string';
  else if(/^(interface|type|export|import|from|const|let|return|await|async|throw|new|if|else|try|catch|extends|readonly|keyof|typeof)$/.test(word))kind='keyword';
  else if(/^(true|false|null|undefined)$/.test(word)||/^\d/.test(word))kind='literal';
  else if(/^(string|number|boolean|void|unknown|never|any)$/.test(word)||/^[A-Z]/.test(word))kind='type';
  else if(/^\s*\(/.test(tail))kind='function';
  else if(/^\s*\??:/.test(tail))kind='property';
  result+=esc(input.slice(end,match.index))+(kind?`<span class="tok-${kind}">${esc(word)}</span>`:esc(word));
  end=match.index+word.length;
 }
 return result+esc(input.slice(end));
}
function codeBlock(value){return `<pre class="code-block"><code>${highlight(value)}</code></pre>`;}

function signature(i){return i.id==='I2'?i.signature.replace('"다시 저장하기"',JSON.stringify(s.saveLabel)):i.signature;}
function effectiveTest(t){return t.id==='p-ui'?{...t,then:[`안내 문구: "${s.message}"`, `재시도 버튼 이름: "${s.saveLabel}"`,...t.then]}:t;}
function rules(ids){return `<div class="rule-links">${ids.map(id=>`<button data-rule="${id}">${id} · ${esc(R.find(r=>r.id===id).title)}</button>`).join('')}</div>`;}
function testLinks(ids){return `<div class="row">${ids.map(id=>`<button class="button" data-test="${id}">${esc(id)}</button>`).join('')}</div>`;}
function screenCard(proposed){const error=s.scene==='error',saving=s.scene==='saving',done=s.scene==='success';const message=error?(proposed?s.message:U.existingMessage):saving?'저장 중입니다. 완료 후 나갈 수 있습니다.':done?'상대방 문장이 끝나면 녹음할 수 있어요':'저장하거나 다시 녹음할 수 있어요';return `<div><div class="compare-label"><h3>${proposed?'변경 제안':'기존 화면'}</h3><span class="badge ${proposed?'warn':''}">${proposed?'D1 · D2':'코드 기준 재구성'}</span></div><div class="echo-screen"><div class="echo-top"><span class="exit" aria-hidden="true">×</span><div class="progress"><span style="width:${done?60:40}%"></span></div><span>${done?'3':'2'} / 5</span></div><div class="echo-inner"><div class="partner"><small>Partner</small><p>${done?'Let’s move on to the next topic.':U.fixture.partnerLine}</p></div><div class="orb" aria-label="녹음 버튼 위치"><span>MIC</span></div><span class="timer">${done?'0:00':'0:08'}</span><button class="hotspot ${proposed&&error?'changed':''}" data-region="error-feedback" aria-pressed="${s.region==='error-feedback'}">${proposed&&error?'<span class="change-tag">D1 · 안내 문구 변경</span>':''}${esc(message)}</button>${!saving&&!done?`<button class="hotspot" data-region="capture" aria-pressed="${s.region==='capture'}"><span class="audio-player"><span aria-hidden="true">▷</span><span>0:00</span><span class="audio-track"></span><span>0:08</span></span></button>`:''}${!done?`<button class="hotspot ${proposed&&error?'changed':''}" data-region="recording-controls" aria-pressed="${s.region==='recording-controls'}">${proposed&&error?'<span class="change-tag">D2 · 저장 액션 문구 변경</span>':''}<span class="echo-actions"><span>다시 녹음</span><span class="save">${saving?'저장 중':proposed&&error?esc(s.saveLabel):U.existingSaveLabel}</span></span></button>`:''}</div></div></div>`;}
function selectedRegion(){const target=s.region,interfaces=I.filter(i=>i.nodeIds.includes(target));const rs=R.filter(r=>r.nodeIds.includes(target));const change=U.changes.find(c=>c.region===target);return `<section class="selection"><div class="row spread"><h3>${target==='error-feedback'?'오류 안내':target==='capture'?'녹음 재생기':'저장 / 다시 녹음'} · ${change?change.id:'기존 유지'}</h3><button class="button" data-action="edit">변경안 편집</button></div><div class="selection-grid"><div><h4>도메인 규칙</h4>${rs.slice(0,2).map(r=>`<p><strong>${r.id}</strong> ${esc(r.statement)}</p>`).join('')}${rules(rs.map(r=>r.id))}<h4 class="section-gap">연결 테스트</h4>${testLinks(T.filter(t=>t.nodeIds.includes(target)).map(t=>t.id))}</div><div><h4>연결 interface</h4>${interfaces.slice(0,target==='recording-controls'?2:1).map(i=>`<div><p><span class="badge ${i.status.includes('제안')?'warn':''}">${esc(i.status)}</span></p>${codeBlock(signature(i))}<a class="source" href="${source(i.path)}" target="_blank" rel="noreferrer">${esc(i.path)}</a></div>`).join('')}<button class="button" data-tab="domain">규칙·계약 전체</button></div></div></section>`;}
function edit(){return `<section class="editor"><div class="row spread"><h3>D1 · D2 변경안</h3><button class="button" data-action="cancel">닫기</button></div><label>실패 안내 문구<textarea data-field="message" maxlength="500">${esc(s.message)}</textarea></label><label>저장 재시도 버튼<input type="text" data-field="label" maxlength="40" value="${esc(s.saveLabel)}"></label><label>결정 이유<textarea data-field="reason" maxlength="300"></textarea></label><p class="small dim">변경 시 p-ui · m-a11y 확인 해제. R1–R6와 actions.save 계약 유지.</p><button class="button primary" data-action="apply">반영</button><p data-error role="alert"></p></section>`;}
const FLOW_NODES=X.executionFlow.nodes,FLOW_STEPS=X.executionFlow.steps;
const moduleMap={client:'recording-controls',panel:'recording-controls',controller:'turn',store:'session-store',turn:'turn',audio:'capture',persist:'persistence',api:'recording-api','save-server':'recording-api'};
function originBadge(id){return `<span class="origin existing">기존</span>${['client','panel'].includes(id)?'<span class="origin modified">수정 제안</span>':''}`;}
function moduleInfo(id){
 const node=FLOW_NODES.find(n=>n.id===id),graph=G.nodes.find(n=>n.id===id),model=node?.model||moduleMap[id];
 return {name:node?.name||graph?.label||id,description:M.flow.nodes.find(n=>n.id===model)?.architecture?.responsibility||graph?.caption||'',contracts:I.filter(i=>i.nodeIds.includes(model))};
}
function stateBadge(key,value,changed=false){return `<span class="state-badge ${changed?'changed':''}"><span class="state-key">${esc(key)}</span><strong>${esc(value)}</strong></span>`;}
function moduleStates(id){
 const i=s.flowIndex??0,waiting=[0,1,2,3,5,6,7].includes(i);
 const rows={turn:[['작업',i===8?'완료':i===4?'오류 처리':'진행 중']],store:[['currentStep',i===8?3:2],['saving',waiting],['saveFailed',i===4]],audio:[['recordedAudio',i===8?'null':'Blob A']],persist:[['recordingId',i===0?'미할당':'ID A'],['요청',i<2?0:i>=6?2:1]],api:[['저장 행',i<2?0:1],['응답',i===3?'유실':i>=7?'200':'미확인']]};
 const changes=flowStep().changes.filter(c=>c[0]===id).map(c=>c[1]);
 return `<span class="state-group">${(rows[id]||[]).map(([key,value])=>stateBadge(key,value,changes.includes(key))).join('')}</span>`;
}
function popupMarkup(id){const info=moduleInfo(id);return `<div class="popup-heading">${originBadge(id)}<span class="small dim">interface 발췌</span></div><h4><code class="symbol">${esc(info.name)}</code></h4><p>${esc(info.description)}</p>${info.contracts.slice(0,1).map(i=>`<div class="popup-contract"><span class="small dim">${esc(i.title)} · ${esc(i.status)}</span>${codeBlock(signature(i))}</div>`).join('')}`;}
let popupAnchor=null,popupTimer;
function closeFunctionPopup(){clearTimeout(popupTimer);const popup=root.querySelector('.function-popup');if(popup)popup.hidden=true;popupAnchor?.removeAttribute('aria-describedby');popupAnchor=null;}
function showFunctionPopup(anchor){
 clearTimeout(popupTimer);if(!anchor)return;
 const popup=root.querySelector('.function-popup');if(!popup)return;
 popupAnchor?.removeAttribute('aria-describedby');popupAnchor=anchor;
 popup.innerHTML=popupMarkup(anchor.dataset.function);popup.hidden=false;anchor.setAttribute('aria-describedby','echo-function-popup');
 const box=root.getBoundingClientRect(),target=anchor.getBoundingClientRect();
 popup.style.width=Math.min(460,box.width-24)+'px';
 const width=popup.getBoundingClientRect().width,height=popup.getBoundingClientRect().height;
 const left=target.left-box.left-width-12;
 popup.style.left=Math.max(12,Math.min(box.width-width-12,left>=12?left:target.left-box.left))+'px';
 popup.style.top=Math.max(12,Math.min(box.height-height-12,left>=12?target.top-box.top:target.bottom-box.top+8))+'px';
}
root.addEventListener('pointerover',e=>{if(e.target.closest('.function-popup')){clearTimeout(popupTimer);return;}const anchor=e.target.closest('[data-function]');if(anchor&&anchor!==popupAnchor)showFunctionPopup(anchor);});
root.addEventListener('pointerout',e=>{if(e.target.closest('[data-function],.function-popup')&&!e.relatedTarget?.closest?.('[data-function],.function-popup'))popupTimer=setTimeout(closeFunctionPopup,220);});
root.addEventListener('focusin',e=>{const anchor=e.target.closest('[data-function]');if(anchor)showFunctionPopup(anchor);else closeFunctionPopup();});
root.addEventListener('focusout',e=>{if(!e.relatedTarget?.closest?.('[data-function],.function-popup'))closeFunctionPopup();});
root.addEventListener('keydown',e=>{if(e.key==='Escape')closeFunctionPopup();});
root.addEventListener('pointerdown',e=>{if(!e.target.closest('[data-function],.function-popup'))closeFunctionPopup();});

function flowNodeState(id){const i=s.flowIndex??0,waiting=[0,1,2,3,5,6,7].includes(i);return ({turn:i===8?'저장 성공 · 정리 후 진행':i===4?'오류 처리 · 녹음 보존':waiting?'저장 작업 진행 중':'대기',store:`currentStep: ${i===8?3:2} · saving: ${waiting}\nsaveFailed: ${i===4}`,audio:i===8?'recordedAudio: null':'recordedAudio: Blob A',persist:i===0?'저장 ID 준비 전':`Blob A → ID A · 요청 ${i>=6?2:1}회`,api:i<2?'저장 행: 0개':`저장 행: 1개${i===3?' · 응답 유실':i>=7?' · 성공 응답':''}`})[id];}
function flowNodeName(id){return FLOW_NODES.find(n=>n.id===id)?.name??({'view-action':'저장 버튼','view-feedback':'오류 안내','view-progress':'화면 진행'}[id]??id);}
function flowSelection(){const n=FLOW_NODES.find(n=>n.id===s.flowNode);if(!n)return selectedRegion();const contracts=I.filter(i=>i.nodeIds.includes(n.model)),rs=R.filter(r=>r.nodeIds.includes(n.model));return `<details class="selection"><summary><code class="symbol">${esc(n.name)}</code> · 계약과 검증</summary>${rules(rs.map(r=>r.id))}${contracts.slice(0,1).map(i=>`${codeBlock(signature(i))}`).join('')}${testLinks(T.filter(t=>t.nodeIds.includes(n.model)).map(t=>t.id))}</details>`;}
function flowScreen(){const st=flowStep();s.scene=st.scene;const index=s.flowIndex??0,active=new Set(st.links.flatMap(l=>l.slice(0,2)));let screen=screenCard(true);screen=screen.replace(/<div class="compare-label">.*?<\/div>/,'<div class="compare-label"><h3>녹음 화면</h3><span class="small dim">제안 와이어프레임</span></div>');screen=screen.replace('class="echo-top"','class="echo-top" data-flow-endpoint="view-progress"').replace('data-region="recording-controls"','data-flow-endpoint="view-action" data-region="recording-controls"').replace('data-region="error-feedback"','data-flow-endpoint="view-feedback" data-region="error-feedback"');for(const id of ['view-action','view-feedback','view-progress'])if(active.has(id))screen=screen.replace(`data-flow-endpoint="${id}"`,`data-flow-endpoint="${id}" data-flow-active="true"`);
 return `<div class="flow-heading row spread"><div><h3>응답 유실 → 재시도</h3><span class="small dim">설계 시뮬레이션 · 실행 전</span></div><span class="row"><span class="origin existing">기존 함수 재사용</span><span class="origin added">신규 함수 0</span><span class="badge">${index+1} / ${FLOW_STEPS.length}</span></span></div><div class="flow-canvas"><div class="flow-view">${screen}</div><aside class="flow-modules" aria-label="화면 외부 상태와 API">${FLOW_NODES.map(n=>`<button class="flow-module ${active.has(n.id)?'executing':''}" data-function="${n.id}" data-flow-inspect="${n.id}" data-flow-endpoint="${n.id}" aria-pressed="${s.flowNode===n.id}"><span class="module-meta">${originBadge(n.id)}<span class="small dim">${esc(n.kind)}</span></span><code class="symbol">${esc(n.name)}</code><span class="module-description">${esc(moduleInfo(n.id).description)}</span>${moduleStates(n.id)}${active.has(n.id)?'<span class="flow-active-label">현재 단계</span>':''}</button>`).join('')}</aside><svg class="flow-overlay" role="img" aria-label="현재 단계의 화면·store·API 연결"><defs><marker id="echo-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" style="fill:var(--amber);stroke:none"/></marker></defs><g data-flow-paths></g></svg></div><section class="flow-trace"><div class="row spread"><h3>${index+1}. ${esc(st.title)}</h3><div class="row"><button class="button" data-action="flow-prev" ${index===0?'disabled':''}>← 이전</button><button class="button primary" data-action="flow-next" ${index===FLOW_STEPS.length-1?'disabled':''}>다음 →</button></div></div><div class="flow-track" aria-label="실행 단계">${FLOW_STEPS.map((v,i)=>`<button data-flow-step="${i}" aria-label="${i+1}. ${esc(v.title)}" aria-pressed="${i===index}" class="${i<index?'visited':''}">${i+1}</button>`).join('')}</div>${codeBlock(st.code)}<div class="flow-path-list">${st.links.map((e,i)=>`<span><b>${i+1}</b> <span>${esc(flowNodeName(e[0]))} ${e[3]==='lost'?'⇢ ×':'→'} ${esc(flowNodeName(e[1]))}</span><small>${esc(e[2])}</small></span>`).join('')}</div><table class="flow-deltas"><thead><tr><th>소유자 · 상태</th><th>이전</th><th>이후</th></tr></thead><tbody>${st.changes.map(([owner,key,before,after])=>`<tr><td><div class="field-owner"><code class="symbol">${esc(flowNodeName(owner))}</code><span class="field-identity"><span class="field-kind">${owner==='store'||owner==='audio'?'STATE':owner==='api'?'DB':key==='요청 결과'?'RESULT':'REF'}</span><code>${esc(key)}</code></span></div></td><td>${stateBadge("이전",before)}</td><td>${stateBadge(before===after?"유지":"변경",after,before!==after)}</td></tr>`).join('')}</tbody></table><div class="row spread section-gap">${rules(st.rules)}${testLinks(st.tests)}</div></section>${flowSelection()}${s.editing?edit():''}<details class="section-gap"><summary>기존 화면과 변경 제안 비교</summary><div class="compare" style="margin-top:15px">${screenCard(false)}<div class="compare-arrow" aria-hidden="true">→</div>${screenCard(true)}</div><p class="screen-note">코드 기준 재구성 · 실제 캡처 아님</p></details>`;

function drawFlow(){const canvas=root.querySelector('.flow-canvas');if(!canvas)return;const svg=canvas.querySelector('.flow-overlay'),group=canvas.querySelector('[data-flow-paths]'),o=canvas.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${o.width} ${o.height}`);group.innerHTML=flowStep().links.map(([from,to,label,kind],i)=>{const a=canvas.querySelector(`[data-flow-endpoint="${from}"]`)?.getBoundingClientRect(),b=canvas.querySelector(`[data-flow-endpoint="${to}"]`)?.getBoundingClientRect();if(!a||!b)return '';const sameColumn=o.width<550||Math.abs(a.left-b.left)<30;let d,x,y;if(sameColumn){const x1=a.right-o.left,x2=b.right-o.left,y1=a.top-o.top+a.height/2,y2=b.top-o.top+b.height/2,rail=Math.min(o.width-5,Math.max(x1,x2)+17+i*5);d=`M${x1},${y1} H${rail} V${y2} H${x2}`;x=rail;y=(y1+y2)/2;}else{const forward=a.left<b.left,x1=(forward?a.right:a.left)-o.left,x2=(forward?b.left:b.right)-o.left,y1=a.top-o.top+a.height/2,y2=b.top-o.top+b.height/2,mid=(x1+x2)/2;d=`M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`;x=mid;y=(y1+y2)/2;}return `<path d="${d}" class="${kind==='lost'?'lost':''}" ${kind==='lost'?'':'marker-end="url(#echo-flow-arrow)"'}/><circle cx="${x}" cy="${y}" r="10"/><text x="${x}" y="${y+4}" text-anchor="middle">${kind==='lost'?'×':i+1}</text>`;}).join('');}

function graphView(){const selected=G.nodes.find(n=>n.id===s.node)||G.nodes[0];const mapping={client:'recording-controls',panel:'recording-controls',controller:'turn',store:'session-store',turn:'turn',audio:'capture',persist:'persistence',api:'recording-api','save-server':'recording-api'};const nodeId=mapping[selected.id],contracts=I.filter(i=>i.nodeIds.includes(nodeId));return `<div class="row spread" style="margin-bottom:15px"><h3>저장 호출과 상태 소유권</h3><span class="badge">기존 호출 구조 유지</span></div><div class="graph"><div class="graph-grid">${G.nodes.map(n=>`<button class="graph-node" data-function="${n.id}" data-graph-node="${n.id}" data-group="${n.group}" style="grid-column:${n.col};grid-row:${n.row}" aria-pressed="${s.node===n.id}">${originBadge(n.id)}<small>${n.group==='server'?'server · API / feature':n.group==='features'?'features / session-recording':'views / recording'}</small><code class="symbol">${esc(n.label)}</code><small>${esc(n.caption)}</small></button>`).join('')}<svg class="graph-lines" aria-label="호출·상태 관계" role="img"><defs><marker id="echo-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" style="fill:var(--dim);stroke:none"/></marker></defs><g data-graph-paths></g></svg></div></div><div class="graph-legend"><span>실선 → 호출·상태 접근</span><span>점선 테두리: 서버 경계</span><span>TanStack Query: 설치됨 · 이 저장 경로에는 연결 없음</span></div><section class="selection"><h3><code class="symbol">${esc(selected.label)}</code></h3><p>${esc(selected.caption)}</p>${rules(R.filter(r=>r.nodeIds.includes(nodeId)).map(r=>r.id))}${contracts.slice(0,1).map(i=>`${codeBlock(signature(i))}`).join('')}<details><summary>선택 노드의 연결</summary><ul>${G.edges.filter(e=>e.from===selected.id||e.to===selected.id).map(e=>`<li><code class="symbol">${esc(G.nodes.find(n=>n.id===e.from).label)}</code> → <code class="symbol">${esc(G.nodes.find(n=>n.id===e.to).label)}</code> · ${esc(e.label)}</li>`).join('')}</ul></details></section><p class="screen-note">호출·상태 관 function drawGraph(){const grid=root.querySelector('.graph-grid');if(!grid)return;const svg=grid.querySelector('.graph-lines'),paths=grid.querySelector('[data-graph-paths]'),o=grid.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${o.width} ${o.height}`);const mobile=o.width<430;paths.innerHTML=G.edges.map((e,index)=>{const a=grid.querySelector(`[data-graph-node="${e.from}"]`).getBoundingClientRect(),b=grid.querySelector(`[data-graph-node="${e.to}"]`).getBoundingClientRect();let d,lx,ly;if(mobile){const rail=o.width-9-(index%3)*12,ay=a.top-o.top+a.height/2,by=b.top-o.top+b.height/2;d=`M${a.right-o.left},${ay} H${rail} V${by} H${b.right-o.left}`;lx=rail-4;ly=(ay+by)/2;}else if(Math.abs(a.top-b.top)<20){const right=a.left<b.left,x1=(right?a.right:a.left)-o.left,x2=(right?b.left:b.right)-o.left,y=a.top-o.top+a.height/2;d=`M${x1},${y} H${x2}`;lx=(x1+x2)/2;ly=y-10;}else{const down=a.top<b.top,x1=a.left-o.left+a.width/2,x2=b.left-o.left+b.width/2,y1=(down?a.bottom:a.top)-o.top,y2=(down?b.top:b.bottom)-o.top,mid=(y1+y2)/2;d=`M${x1},${y1} V${mid} H${x2} V${y2}`;lx=(x1+x2)/2;ly=mid-8;}const active=e.from===s.node||e.to===s.node;return `<path class="${active?'focus-edge':''}" d="${d}" marker-end="url(#echo-arrow)"/>${!mobile?`<text x="${lx}" y="${ly}" text-anchor="middle">${esc(e.label)}</text>`:''}`;}).join('');}

function render(){closeFunctionPopup();app.innerHTML=`<header class="header"><div class="brand"><b>fs</b> Frontend System <span class="dim small">/ Echo</span></div><span class="small dim">172f5f2 기준 · 검토 v${s.revision}</span></header><div class="heading"><h2>녹음 저장 · 응답 유실과 재시도</h2></div><nav class="navigation" aria-label="설계 검토">${[['screen','흐름'],['domain','도메인·계약'],['graph','의존성'],['tests','테스트 계획']].map(([id,label])=>`<button data-tab="${id}" aria-pressed="${s.tab===id}">${label}</button>`).join('')}</nav><main class="content">${s.notice?`<div class="notice" role="status">${esc(s.notice)}</div>`:''}${s.tab==='screen'?screenView():s.tab==='domain'?domainView():s.tab==='graph'?graphView():testView()}<details class="json-data"><summary class="small dim">기반 JSON</summary><pre>${esc(JSON.stringify(s.tab==='tests'?effectiveTest(T.find(t=>t.id===s.test)):s.tab==='graph'?G:s.tab==='domain'?{domain:X.domain,rules:R,interfaces:I.map(i=>({...i,signature:signature(i)}))}:{executionStep:flowStep(),uiBaseline:U,review:{revision:s.revision,message:s.message,saveLabel:s.saveLabel}},null,2))}</pre></details></main><footer class="footer"><span>검증 계획 ${s.confirmed.length} / ${T.length} 확인 · 실제 실행 0</span><button class="button primary" data-action="approve" ${s.confirmed.length!==T.length||s.approved===s.revision?'disabled':''}>${s.approved===s.revision?'이 버전의 테스트 계획 확인됨':'테스트 계획 확인 완료'}</button></footer><aside class="function-popup" id="echo-function-popup" role="tooltip" hidden></aside>`;if(s.tab==='graph'){requestAnimationFrame(drawGraph);}if(s.tab==='screen'){requestAnimationFrame(drawFlow);}}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;let focus='';if(b.dataset.flowStep!==undefined){s.flowIndex=Number(b.dataset.flowStep);s.flowNode=flowStep().links.at(-1)[1];focus=`[data-flow-step="${s.flowIndex}"]`;}else if(b.dataset.flowInspect){s.flowNode=b.dataset.flowInspect;focus=`[data-flow-inspect="${s.flowNode}"]`;}else if(b.dataset.tab){s.tab=b.dataset.tab;focus=`[data-tab="${s.tab}"]`;}else if(b.dataset.scene){s.scene=b.dataset.scene;focus=`[data-scene="${s.scene}"]`;}else if(b.dataset.region){s.region=b.dataset.region;s.flowNode=null;focus=`[data-region="${s.region}"]`;}else if(b.dataset.rule){s.rule=b.dataset.rule;s.tab='domain';focus='[data-tab="domain"]';}else if(b.dataset.test){s.test=b.dataset.test;s.tab='tests';focus=`[data-test="${s.test}"]`;}else if(b.dataset.graphNode){s.node=b.dataset.graphNode;focus=`[data-graph-node="${s.node}"]`;}else{const a=b.dataset.action;if(a==='flow-next'||a==='flow-prev'){s.flowIndex=Math.max(0,Math.min(FLOW_STEPS.length-1,(s.flowIndex??0)+(a==='flow-next'?1:-1)));s.flowNode=flowStep().links.at(-1)[1];}if(a==='edit')s.editing=true;if(a==='cancel')s.editing=false;if(a==='approve'&&s.confirmed.length===T.length){s.approved=s.revision;s.notice=`v${s.revision} 테스트 계획 확인 완료. 구현·실행 증거는 별도입니다.`;}if(a==='apply'){const message=root.querySelector('[data-field="message"]').value.trim(),label=root.querySelector('[data-field="label"]').value.trim(),reason=root.querySelector('[data-field="reason"]').value.trim();if(!message||!label||!reason){root.querySelector('[data-error]').textContent='문구·버튼 이름·결정 이유를 모두 입력하세요.';return;}if(message===s.message&&label===s.saveLabel){root.querySelector('[data-error]').textContent='변경된 내용이 없습니다.';return;}s.message=message;s.saveLabel=label;s.reason=reason;s.revision++;s.confirmed=s.confirmed.filter(id=>!['p-ui','m-a11y'].includes(id));s.approved=0;s.editing=false;s.notice=`v${s.revision} 변경 반영 · p-ui, m-a11y 재확인 필요 · ${reason}`;}focus=(a==='flow-next'||a==='flow-prev')?`[data-flow-step="${s.flowIndex}"]`:s.editing?'[data-field="message"]':`[data-tab="${s.tab}"]`;}render();persist();root.querySelector(focus)?.focus();if(b.dataset.rule)root.querySelector(`#rule-${s.rule}`)?.scrollIntoView?.({block:'nearest'});});
root.addEventListener('change',e=>{const id=e.target.dataset.confirm;if(!id)return;s.confirmed=e.target.checked?[...new Set([...s.confirmed,id])]:s.confirmed.filter(v=>v!==id);s.approved=0;render();persist();root.querySelector(`[data-confirm="${id}"]`)?.focus();});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>{if(s.tab==='graph')requestAnimationFrame(drawGraph);if(s.tab==='screen')requestAnimationFrame(drawFlow);}).observe(app);
render();
})();
